<!doctype html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don Precio</title>
<meta name="description" content="Don Precio — muy pronto.">
<style>
  :root {
    --ink: #1a1410; --marigold: #eab13a; --oxide: #d0492f; --cream: #faf3e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--cream);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 1.6rem;
  }
  .mark { width: 128px; height: 128px; margin: 0 auto 1.4rem; display: block; }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 700; font-size: clamp(1.8rem, 8vw, 2.6rem); margin: 0;
  }
  .eyebrow {
    font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--marigold); font-weight: 700; margin-top: 1.1rem;
  }
  .login {
    display: inline-block; margin-top: 1.8rem; font-size: 0.9rem;
    color: #d8c7a6; text-decoration: none;
    border-bottom: 1px solid rgba(216,199,166,0.4); padding-bottom: 1px;
  }
  .login:hover { color: var(--marigold); border-color: var(--marigold); }
  ::selection { background: var(--marigold); color: var(--ink); }
</style>
</head>
<body>

  <div>
    <svg class="mark" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="120" cy="120" r="118" fill="#eab13a"/>

      <path d="M93,178 L120,202 L147,178 L142,164 L98,164 Z" fill="#f0e4c9"/>
      <ellipse cx="120" cy="108" rx="53" ry="57" fill="#e8b98c"/>
      <ellipse cx="65" cy="110" rx="10" ry="15" fill="#e8b98c"/>
      <ellipse cx="175" cy="110" rx="10" ry="15" fill="#e8b98c"/>
      <path d="M68,92 Q64,55 120,53 Q176,55 172,92 Q166,66 120,64 Q74,66 68,92 Z" fill="#e4ddc9"/>
      <circle cx="99" cy="106" r="15" fill="none" stroke="#1a1410" stroke-width="4.5"/>
      <circle cx="141" cy="106" r="15" fill="none" stroke="#1a1410" stroke-width="4.5"/>
      <line x1="114" y1="106" x2="126" y2="106" stroke="#1a1410" stroke-width="4.5"/>
      <line x1="84" y1="102" x2="70" y2="98" stroke="#1a1410" stroke-width="4"/>
      <line x1="156" y1="102" x2="170" y2="98" stroke="#1a1410" stroke-width="4"/>
      <path d="M82,133 Q101,150 120,137 Q139,150 158,133 Q140,124 120,129 Q100,124 82,133 Z" fill="#e4ddc9"/>
      <path d="M104,151 Q120,162 136,151" fill="none" stroke="#1a1410" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <h1>Don Precio</h1>
    <div class="eyebrow">Muy pronto</div>
  </div>

</body>
</html>
